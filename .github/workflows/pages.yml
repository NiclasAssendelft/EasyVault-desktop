name: Pages

# Publishes the static hosted pages (invite / reset / verified) from docs-site/
# to GitHub Pages. These moved here because Supabase rewrites text/html
# responses on the functions domain (HTML is only allowed on custom domains).

on:
  push:
    branches: [main]
    paths: ["docs-site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site
      - id: deployment
        uses: actions/deploy-pages@v4
