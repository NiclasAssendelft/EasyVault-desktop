<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>Reset password — EasyVault</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center;
      background: radial-gradient(ellipse at 50% 0%, rgba(108,71,255,0.18), transparent 60%), #0b0f18;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px 0;
    }
    :focus-visible { outline: 2px solid #7c6af7; outline-offset: 2px; }
    .card {
      width: 92%; max-width: 380px;
      padding: 32px 28px;
      background: rgba(20, 20, 32, 0.92);
      border: 1px solid rgba(124, 106, 247, 0.32);
      border-radius: 14px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .brand {
      font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
      color: rgba(196,181,253,0.6); margin-bottom: 18px;
    }
    h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
    .sub { margin: 0 0 22px; font-size: 13px; color: rgba(228,228,231,0.55); }
    label {
      display: block; font-size: 12px; color: rgba(228,228,231,0.7);
      margin-bottom: 6px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    input[type=password] {
      width: 100%; min-height: 44px; padding: 11px 13px;
      background: #101018; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; color: #e4e4e7; font-size: 14px;
      outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type=password]:focus {
      border-color: rgba(124,106,247,0.5);
      box-shadow: 0 0 0 3px rgba(124,106,247,0.12);
    }
    .field + .field { margin-top: 14px; }
    button {
      width: 100%; min-height: 46px; margin-top: 18px;
      padding: 12px; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase;
      color: #c4b5fd; background: linear-gradient(135deg, rgba(124,106,247,0.22), rgba(100,82,220,0.12));
      border: 1px solid rgba(124,106,247,0.45); border-radius: 6px;
      cursor: pointer; transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }
    button:hover { border-color: rgba(124,106,247,0.78); box-shadow: 0 0 22px rgba(124,106,247,0.22); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg {
      margin-top: 16px; padding: 11px 13px; border-radius: 6px;
      font-size: 13px; line-height: 1.4; text-align: center;
      overflow-wrap: break-word;
    }
    .msg.error { background: rgba(220,38,38,0.14); border: 1px solid rgba(220,38,38,0.45); color: #fca5a5; }
    .msg.success { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.35); color: #86efac; }
    .footer { margin-top: 18px; text-align: center; font-size: 12px; color: rgba(228,228,231,0.4); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">EasyVault</div>
    <h1>Set a new password</h1>
    <p class="sub">Choose a new password for your EasyVault account.</p>
    <form id="form">
      <div class="field">
        <label for="pw1">New password</label>
        <input id="pw1" type="password" required minlength="6" autofocus
               autocomplete="new-password" aria-label="New password">
      </div>
      <div class="field">
        <label for="pw2">Confirm password</label>
        <input id="pw2" type="password" required minlength="6"
               autocomplete="new-password" aria-label="Confirm new password">
      </div>
      <button id="submit" type="submit">Update password</button>
    </form>
    <div id="msg" class="msg" role="status" aria-live="polite" hidden></div>
    <p class="footer">After updating, open the EasyVault desktop app and sign in.</p>
  </div>

  <script>
    (function () {
      "use strict";

      var SUPABASE_URL = "https://ocokoemfmdodzftqbjim.supabase.co";
      var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jb2tvZW1mbWRvZHpmdHFiamltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2MTA2NjgsImV4cCI6MjA4ODE4NjY2OH0.YQPrNUVDCgIDYP5054PoRdnDyph70gPcNJZSlHjbUH8";

      // Supabase GoTrue puts recovery params in the URL fragment.
      var params = new URLSearchParams((window.location.hash || "").replace(/^#/, ""));
      var accessToken = params.get("access_token");
      var tokenType = params.get("type");

      var form = document.getElementById("form");
      var msg = document.getElementById("msg");
      var btn = document.getElementById("submit");

      function showMsg(text, kind) {
        msg.textContent = text;
        msg.className = "msg " + kind;
        msg.hidden = false;
      }

      if (!accessToken || tokenType !== "recovery") {
        var invalid = "This reset link is invalid or expired.";
        // GoTrue reports expired links via error params in the fragment.
        var desc = params.get("error_description");
        if (desc) invalid += " (" + desc + ")";
        showMsg(invalid, "error");
        form.hidden = true;
        return;
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var pw1 = document.getElementById("pw1").value;
        var pw2 = document.getElementById("pw2").value;
        if (pw1.length < 6) {
          showMsg("Password must be at least 6 characters.", "error");
          return;
        }
        if (pw1 !== pw2) {
          showMsg("Passwords don't match.", "error");
          return;
        }

        btn.disabled = true;
        btn.textContent = "Updating…";
        msg.hidden = true;

        fetch(SUPABASE_URL + "/auth/v1/user", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + accessToken,
            "apikey": SUPABASE_ANON_KEY
          },
          body: JSON.stringify({ password: pw1 })
        })
          .then(function (res) {
            return res.json().catch(function () { return {}; }).then(function (data) {
              if (!res.ok) {
                throw new Error(
                  data.msg || data.error_description || data.error || ("HTTP " + res.status)
                );
              }
            });
          })
          .then(function () {
            showMsg("Password updated — open EasyVault and sign in.", "success");
            form.hidden = true;
          })
          .catch(function (err) {
            btn.disabled = false;
            btn.textContent = "Update password";
            var reason = (err && err.message) ? err.message : String(err);
            showMsg("Couldn't update password: " + reason, "error");
          });
      });
    })();
  </script>
</body>
</html>
