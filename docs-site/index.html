<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>EasyVault</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center;
      background: radial-gradient(ellipse at 50% 0%, rgba(108,71,255,0.18), transparent 60%), #0b0f18;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px 0;
    }
    :focus-visible { outline: 2px solid #7c6af7; outline-offset: 2px; }
    .card {
      width: 92%; max-width: 430px;
      padding: 40px 30px;
      background: rgba(20, 20, 32, 0.92);
      border: 1px solid rgba(124, 106, 247, 0.32);
      border-radius: 14px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      text-align: center;
    }
    .wordmark {
      margin: 0 0 12px; font-size: 26px; font-weight: 600;
      letter-spacing: 0.28em; text-transform: uppercase;
      color: #e4e4e7;
    }
    .wordmark span { color: #c4b5fd; }
    .tagline { margin: 0 0 26px; font-size: 14px; line-height: 1.5; color: rgba(228,228,231,0.62); }
    .primary {
      display: flex; align-items: center; justify-content: center;
      width: 100%; min-height: 48px;
      padding: 13px; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase;
      color: #c4b5fd; background: linear-gradient(135deg, rgba(124,106,247,0.22), rgba(100,82,220,0.12));
      border: 1px solid rgba(124,106,247,0.45); border-radius: 6px;
      text-decoration: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .primary:hover { border-color: rgba(124,106,247,0.78); box-shadow: 0 0 22px rgba(124,106,247,0.22); }
    .footer { margin-top: 24px; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(228,228,231,0.28); }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="wordmark">Easy<span>Vault</span></h1>
    <p class="tagline">A private vault for your files, links, and email — on your desktop.</p>
    <a class="primary" href="https://github.com/NiclasAssendelft/EasyVault-desktop/releases/latest"
       aria-label="Download the latest EasyVault release">Download EasyVault</a>
    <div class="footer">Precision. Security. Control.</div>
  </div>
</body>
</html>
