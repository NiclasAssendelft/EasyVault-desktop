<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>Email verified — EasyVault</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center;
      background: radial-gradient(ellipse at 50% 0%, rgba(108,71,255,0.18), transparent 60%), #0b0f18;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px 0;
    }
    :focus-visible { outline: 2px solid #7c6af7; outline-offset: 2px; }
    .card {
      width: 92%; max-width: 430px;
      padding: 34px 30px;
      background: rgba(20, 20, 32, 0.92);
      border: 1px solid rgba(124, 106, 247, 0.32);
      border-radius: 14px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      text-align: center;
    }
    .brand {
      font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
      color: rgba(196,181,253,0.6); margin-bottom: 20px;
    }
    .icon { margin-bottom: 14px; }
    .icon svg { width: 44px; height: 44px; }
    h1 { margin: 0 0 10px; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
    .sub { margin: 0; font-size: 14px; line-height: 1.5; color: rgba(228,228,231,0.62); }
    .footer { margin-top: 22px; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(228,228,231,0.28); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">EasyVault</div>
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10" stroke="rgba(34,197,94,0.5)" stroke-width="1.5"/>
        <path d="M7.5 12.2l3 3 6-6.4" stroke="#86efac" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Email verified</h1>
    <p class="sub">Your email has been confirmed. Open EasyVault and sign in.</p>
    <div class="footer">EasyVault</div>
  </div>
</body>
</html>
